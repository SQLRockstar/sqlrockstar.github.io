name: Convert Single Markdown Page

on:
  workflow_dispatch:
    inputs:
      markdown_file:
        description: 'The Markdown file to convert'
        required: true
        default: 'sql-server-books.md'
      
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown beautifulsoup4

      - name: Define output path
        id: define-path
        run: |
          MD_FILE="${{ github.event.inputs.markdown_file }}"
          HTML_OUTPUT="${MD_FILE%.md}.html"
          echo "HTML_OUTPUT=$HTML_OUTPUT" >> "$GITHUB_ENV"

      - name: Convert the Markdown file
        run: python convert.py "${{ github.event.inputs.markdown_file }}" "${{ env.HTML_OUTPUT }}"
        working-directory: ${{ github.workspace }}

      - name: Upload converted HTML file
        uses: actions/upload-artifact@v4
        with:
          name: converted-page-${{ github.run_number }}
          path: ${{ env.HTML_OUTPUT }}
