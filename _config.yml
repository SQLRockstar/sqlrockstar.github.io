# Site settings
title: Thomas LaRock
email: your-email@example.com
description: > # this means to ignore newlines until "baseurl:"
  Data engineering, developer advocacy, and technical leadership insights
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://sqlrockstar.github.io" # the base hostname & protocol for your site

#theme: jekyll-theme-minima

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# GitHub Pages specific settings
github_username: sqlrockstar
timezone: America/New_York
